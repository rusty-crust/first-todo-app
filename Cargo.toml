[package]
name = "todo"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = [ "runtime-tokio", "tls-native-tls", "sqlite", "derive", "macros", "migrate" ] }
tokio = { version = "1.20.0", features = ["rt", "macros"] }

[dependencies.uuid]
version = "1.16.0"
# Lets you generate random UUIDs
features = [
    "v4", "serde"
]
